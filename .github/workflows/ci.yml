name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same PR / branch cancels the run it supersedes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:            # the backend runs on PostgreSQL only, tests included (decision D3)
        image: postgres:16-alpine
        env:
          POSTGRES_USER: valuation
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: valuation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U valuation" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://valuation:ci@localhost:5432/valuation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff pip-audit
      - name: lint (ruff — pyflakes errors, see ruff.toml)
        run: ruff check .
      - name: dependency vulnerabilities (pip-audit)
        run: pip-audit -r backend/requirements.txt --progress-spinner off
      - name: v1 engine tests
        run: python -m pytest -q
      - name: v2 API tests (incl. migration up/down/up)
        run: python -m pytest backend/tests -q
      - name: versions agree
        run: python scripts/bump_version.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # `working-directory` does not apply to `uses:` steps; point the action at the
          # package.json that declares `packageManager`, otherwise it finds no pnpm version.
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: runtime dependency vulnerabilities (shipped to browsers; blocking)
        run: pnpm audit --prod --audit-level moderate
      - name: all dependency vulnerabilities (build tools included; report only)
        run: pnpm audit --audit-level high || true
      - run: pnpm build:tokens
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: compose files are valid
        run: APP_SECRET_KEY=ci docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: build images
        run: APP_SECRET_KEY=ci docker compose build
