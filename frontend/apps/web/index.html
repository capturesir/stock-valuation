<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5FBF">

<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<title>估值工作台</title>
<script>
  // apply the saved theme before the first paint (light by default; "system" follows the OS)
  try { var t = localStorage.getItem("sv.theme") || "light"; if (t !== "system") document.documentElement.setAttribute("data-theme", t); }
  catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
</script>
</head>
<body>
<div id="root"></div>
<noscript>估值工作台需要啟用 JavaScript。</noscript>
<script type="module" src="/src/main.tsx"></script>
