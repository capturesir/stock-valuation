# Development overrides: hot reload for the API and worker, API on :8000 for `pnpm dev`.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build db redis api worker
#   cd frontend && pnpm dev        (Vite on :5173 proxies /api to :8000)
services:
  api:
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "backend", "--reload-dir", "src"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
      - ./backend:/app/backend
      - ./prompts:/app/prompts
      - appdata:/app/var
      - outputs:/app/out
      - cases:/app/cases
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  worker:
    volumes:
      - ./src:/app/src
      - ./backend:/app/backend
      - ./prompts:/app/prompts
      - appdata:/app/var
      - outputs:/app/out
      - cases:/app/cases
